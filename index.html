<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoMed Request Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .tail-container { max-width: 1280px; margin: 0 auto; }
        .request-card { transition: all 0.2s; }
        .request-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="tail-container mx-auto p-6">
        <div class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">PhotoMed Request Tracker</h1>
                <p class="text-gray-600 mt-1">Submit and manage requests, feedback &amp; ideas</p>
            </div>
            <button onclick="exportToCSV()" 
                    class="flex items-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 px-5 py-3 rounded-2xl text-sm font-medium shadow-sm">
                <i class="fas fa-download"></i> Export CSV
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 bg-white rounded-3xl shadow-sm border border-gray-200 p-8">
                <h2 class="text-2xl font-semibold text-gray-900 mb-6">Submit a Request</h2>
                
                <form id="requestForm" onsubmit="handleSubmit(event)">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                            <input type="text" id="fullName" required class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                            <input type="email" id="email" required class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Product / Service</label>
                            <select id="product" required class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500">
                                <option value="">Select Product</option>
                                <option value="PhotoMed Mobile App">PhotoMed Mobile App</option>
                                <option value="PhotoMed Analytics Dashboard">PhotoMed Analytics Dashboard</option>
                                <option value="PhotoMed Logistics & Supply Chain">PhotoMed Logistics & Supply Chain</option>
                                <option value="PhotoMed Partner Portal">PhotoMed Partner Portal</option>
                                <option value="PhotoMed Website">PhotoMed Website</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Request Type</label>
                            <select id="requestType" required class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500">
                                <option value="Bug">Bug Report</option>
                                <option value="Feature Request">Feature Request</option>
                                <option value="General Feedback">General Feedback</option>
                                <option value="Partnership">Partnership</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Priority</label>
                            <select id="priority" required class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                            <textarea id="message" rows="5" required class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-3xl focus:outline-none focus:border-blue-500 resize-y" placeholder="Describe your request in detail..."></textarea>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl transition-all">
                            Submit Request
                        </button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-7">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="stats"></div>

                <div class="bg-white rounded-3xl shadow-sm p-6 mb-6">
                    <div class="flex flex-col md:flex-row gap-4">
                        <select id="filterStatus" onchange="filterRequests()" class="flex-1 bg-gray-50 border border-gray-200 px-5 py-4 rounded-2xl focus:outline-none focus:border-blue-500">
                            <option value="">All Statuses</option>
                            <option value="New">New</option>
                            <option value="In Review">In Review</option>
                            <option value="Resolved">Resolved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                        <select id="filterPriority" onchange="filterRequests()" class="flex-1 bg-gray-50 border border-gray-200 px-5 py-4 rounded-2xl focus:outline-none focus:border-blue-500">
                            <option value="">All Priorities</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div id="requestsList" class="space-y-4 max-h-[520px] overflow-y-auto pr-2"></div>

                <div id="emptyState" class="bg-white rounded-3xl shadow-sm border border-gray-100 h-[420px] flex items-center justify-center text-center hidden">
                    <div>
                        <div class="text-7xl mb-4">📭</div>
                        <h3 class="text-xl font-semibold text-gray-800">No requests found</h3>
                        <p class="text-gray-500 mt-2">Submit your first request above</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-8 right-8 bg-green-600 text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <i class="fas fa-check-circle text-2xl"></i>
        <div><div class="font-semibold">Request Submitted Successfully!</div></div>
    </div>

    <script>
        let requests = JSON.parse(localStorage.getItem('requests')) || [];

        function cleanData() {
            requests = requests.map(req => ({
                id: req.id || 'req_' + Date.now(),
                fullName: req.fullName || 'Unknown',
                email: req.email || 'no-email@example.com',
                product: req.product || 'No Product Selected',
                requestType: req.requestType || 'General Feedback',
                priority: req.priority || 'Medium',
                message: req.message || 'No message provided',
                status: req.status || 'New',
                date: req.date && !isNaN(new Date(req.date).getTime()) ? req.date : new Date().toISOString()
            })).filter(req => req.fullName && req.email);
            
            localStorage.setItem('requests', JSON.stringify(requests));
        }

        function saveRequests() {
            localStorage.setItem('requests', JSON.stringify(requests));
        }

        function updateStats() {
            const total = requests.length;
            const newCount = requests.filter(r => r.status === 'New').length;
            const reviewCount = requests.filter(r => r.status === 'In Review').length;
            const resolvedCount = requests.filter(r => r.status === 'Resolved').length;

            document.getElementById('stats').innerHTML = `
                <div class="bg-white rounded-3xl p-6 border border-gray-100">
                    <div class="text-blue-600 text-4xl font-bold">${total}</div>
                    <div class="text-gray-500 text-sm font-medium mt-1">Total Requests</div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-gray-100">
                    <div class="text-amber-600 text-4xl font-bold">${newCount}</div>
                    <div class="text-gray-500 text-sm font-medium mt-1">New</div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-gray-100">
                    <div class="text-orange-500 text-4xl font-bold">${reviewCount}</div>
                    <div class="text-gray-500 text-sm font-medium mt-1">In Review</div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-gray-100">
                    <div class="text-green-500 text-4xl font-bold">${resolvedCount}</div>
                    <div class="text-gray-500 text-sm font-medium mt-1">Resolved</div>
                </div>
            `;
        }

        function renderRequests(filteredRequests) {
            const container = document.getElementById('requestsList');
            const empty = document.getElementById('emptyState');
            
            if (filteredRequests.length === 0) {
                container.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            empty.classList.add('hidden');

            container.innerHTML = filteredRequests.map(req => `
                <div class="request-card bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-semibold text-lg">${req.fullName}</div>
                            <div class="text-sm text-gray-500">${req.email} • ${req.product}</div>
                        </div>
                        <select onchange="updateStatus('${req.id}', this.value)" class="text-sm border border-gray-300 rounded-xl px-4 py-1 focus:outline-none focus:border-blue-500">
                            <option value="New" ${req.status === 'New' ? 'selected' : ''}>New</option>
                            <option value="In Review" ${req.status === 'In Review' ? 'selected' : ''}>In Review</option>
                            <option value="Resolved" ${req.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                            <option value="Rejected" ${req.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </div>
                    
                    <div class="mt-4 flex gap-3">
                        <span class="px-3 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-700">${req.requestType}</span>
                        <span class="px-3 py-1 text-xs font-medium rounded-full ${req.priority === 'High' ? 'bg-red-100 text-red-700' : req.priority === 'Medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700'}">
                            ${req.priority}
                        </span>
                    </div>
                    
                    <p class="mt-4 text-gray-700">${req.message}</p>
                    <div class="text-xs text-gray-400 mt-4">${new Date(req.date).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function updateStatus(id, newStatus) {
            requests = requests.map(req => req.id === id ? {...req, status: newStatus} : req);
            saveRequests();
            filterRequests();
            updateStats();
        }

        function handleSubmit(e) {
            e.preventDefault();

            const newRequest = {
                id: 'req_' + Date.now(),
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                product: document.getElementById('product').value || 'No Product Selected',
                requestType: document.getElementById('requestType').value,
                priority: document.getElementById('priority').value,
                message: document.getElementById('message').value.trim(),
                status: 'New',
                date: new Date().toISOString()
            };

            requests.unshift(newRequest);
            saveRequests();
            filterRequests();
            updateStats();

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);

            e.target.reset();
        }

        function filterRequests() {
            const statusFilter = document.getElementById('filterStatus').value;
            const priorityFilter = document.getElementById('filterPriority').value;

            let filtered = requests;

            if (statusFilter) filtered = filtered.filter(r => r.status === statusFilter);
            if (priorityFilter) filtered = filtered.filter(r => r.priority === priorityFilter);

            renderRequests(filtered);
        }

        function exportToCSV() {
            if (requests.length === 0) {
                alert("No requests to export!");
                return;
            }

            let csv = "Date,Name,Email,Product,Type,Priority,Status,Message\n";
            requests.forEach(req => {
                csv += `"${new Date(req.date).toLocaleString()}","${req.fullName}","${req.email}","${req.product}","${req.requestType}","${req.priority}","${req.status}","${req.message.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `PhotoMed_Requests_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function init() {
            cleanData();
            updateStats();
            filterRequests(); 
        }

        window.onload = init;
    </script>
</body>
</html>
